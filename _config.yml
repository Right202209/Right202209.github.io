# ------------------------------------------------------------
#  Stoa — a quiet Jekyll theme for people who think in public.
# ------------------------------------------------------------
title: Droit
author: Droit
email: right202601@gmail.com
description: "A small place to think slowly."
url: "https://droite.me"          # e.g. https://example.com
baseurl: ""      # e.g. /blog
# Languages: the first is the default and lives at /, the others live at /<code>/.
# Use a hyphen (zh-CN), never an underscore (zh_CN).
lang: zh-CN
languages: [zh-CN, en]
timezone: Asia/Shanghai

avatar: /assets/img/avatar.svg

home:
  news_limit: 3
  posts_limit: 5

permalink: /blog/:year/:title/

# Reading time on posts ("N 分钟" / "N min"), per language.
# Chinese counts characters (about 400 a minute); other languages count words.
reading_speed:
  zh-CN: 400
  en: 220

# One Atom feed per language: /feed.xml (中文) and /en/feed.xml (English).
feed_limit: 20

# Optional pages. Set one to false to switch it off: its links disappear and its URL
# sends visitors back to the post list.
tags_page: true      # /tags/    and /en/tags/
archive_page: true   # /archive/ and /en/archive/

# "Reading" works like posts: one Markdown file per piece in _reading/ (English in _reading/en/).
collections:
  reading:
    output: true
    permalink: /reading/:name/

# Posts in _posts/en/ are English and live under /en/blog/.
defaults:
  - scope: { path: "" }
    values: { lang: zh-CN }
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "_posts/en" }
    values: { lang: en, permalink: "/en/blog/:year/:title/" }
  - scope: { path: "_reading", type: reading }
    values: { layout: reading }
  - scope: { path: "_reading/en", type: reading }
    values: { lang: en, permalink: "/en/reading/:name/" }
  - scope: { path: "en" }
    values: { lang: en }
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: false

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - README.md
  - README.zh.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - LICENSE
  - docs
  - scripts
