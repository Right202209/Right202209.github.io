# ------------------------------------------------------------
#  Stoa — a quiet Jekyll theme for people who think in public.
# ------------------------------------------------------------
title: Stoa
author: Droit
email: right202601@gmail.com
description: "A small place to think slowly."
url: ""          # e.g. https://example.com
baseurl: ""      # e.g. /blog
# Languages: the first is the default and lives at /, the others live at /<code>/.
# Use a hyphen (zh-CN), never an underscore (zh_CN).
lang: zh-CN
languages: [zh-CN, en]
timezone: Asia/Shanghai

avatar: /assets/img/avatar.svg

social:
  github: your-github
  x: your-x
  email: right202601@gmail.com
  rss: true

home:
  news_limit: 3
  posts_limit: 5

permalink: /blog/:year/:title/

# Posts in _posts/en/ are English and live under /en/blog/.
defaults:
  - scope: { path: "" }
    values: { lang: zh-CN }
  - scope: { path: "_posts/en" }
    values: { lang: en, permalink: "/en/blog/:year/:title/" }
  - scope: { path: "en" }
    values: { lang: en }
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    disable: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - LICENSE
