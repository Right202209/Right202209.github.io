{% include lang.html %}
<footer class="site-footer">
  <div class="wrap">
    <div class="social">
      {% if site.social.email %}<a href="mailto:{{ site.social.email }}">Email</a>{% endif %}
      {% if site.social.github %}<a href="https://github.com/{{ site.social.github }}">GitHub</a>{% endif %}
      {% if site.social.x %}<a href="https://x.com/{{ site.social.x }}">X</a>{% endif %}
      {% if site.social.rss %}<a href="{{ '/feed.xml' | relative_url }}">RSS</a>{% endif %}
    </div>
    <p class="fine">© {{ site.time | date: "%Y" }} {{ site.author }}. {{ t.footer }}</p>
  </div>
</footer>
