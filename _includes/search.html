{% include lang.html %}
<div class="search" id="search" hidden>
  <div class="search-panel" role="dialog" aria-label="Search">
    <div class="search-head">
      <input id="search-input" type="search" placeholder="{{ t.search_placeholder }}" autocomplete="off" enterkeyhint="search">
      <button type="button" class="search-close" id="search-close">{{ t.search_close }}</button>
    </div>
    <ul id="search-results"></ul>
  </div>
</div>
<script>window.SEARCH_INDEX = "{{ '/search.json' | relative_url }}"; window.SEARCH_EMPTY = {{ t.search_empty | jsonify }};
{%- capture se %}{% include droit.html key="search_empty" url_only="1" %}{% endcapture %}{%- capture sl %}{% include droit.html key="search_loading" url_only="1" %}{% endcapture %}
window.SEARCH_ART = { empty: {{ se | strip | jsonify }}, loading: {{ sl | strip | jsonify }} };</script>
