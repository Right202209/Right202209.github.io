name: ✍️ 发布文章
description: 用中文写一篇文章；提交后自动生成 Markdown、翻译英文版并部署。
title: "[文章] "
labels: [post]
body:
  - type: markdown
    attributes:
      value: |
        Issue 标题就是文章标题（`[文章]` 前缀会被自动去掉）。只写中文，英文版由 Action 翻译。
        之后再编辑这个 Issue，文章会随之更新。
  - type: input
    id: description
    attributes:
      label: 摘要
      description: 一句话，显示在标题下方和文章列表里。
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 用逗号或空格分隔，例如「随笔, 生活」。
  - type: input
    id: slug
    attributes:
      label: Slug（可选）
      description: 英文短链接，如 a-quiet-morning。留空则根据标题自动生成。
  - type: textarea
    id: body
    attributes:
      label: 正文
      description: 支持 Markdown，可以直接拖入图片。
    validations:
      required: true
