- title: Meditations
  author: Marcus Aurelius
  note: Notes a man wrote to himself, never meant for us.
  url: https://en.wikipedia.org/wiki/Meditations
- title: The Bitter Lesson
  author: Rich Sutton
  note: General methods win. Our cleverness is usually in the way.
