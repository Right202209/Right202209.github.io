{% include lang.html %}<!doctype html>
<html lang="{{ L }}" data-theme="light">
  {% include head.html %}
  <body>
    {% include header.html %}
    <main class="wrap" id="main">
      {{ content }}
    </main>
    {% include footer.html %}
    {% include search.html %}
    <script type="speculationrules">
    { "prerender": [{
        "where": { "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/assets/*" } },
          { "not": { "href_matches": "/*.xml" } },
          { "not": { "selector_matches": "[data-no-prerender], [data-photo], [target=_blank]" } }
        ] },
        "eagerness": "moderate"
    }] }
    </script>
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/player.js' | relative_url }}" defer></script>
    {% if page.oneko %}{% comment %} The cat chases a mouse pointer, so phones and tablets skip it. {% endcomment %}
    <script>if (matchMedia('(hover: hover) and (pointer: fine)').matches) { var s = document.createElement('script'); s.src = "{{ '/assets/js/oneko.js' | relative_url }}"; s.dataset.cat = "{{ '/assets/img/oneko.png' | relative_url }}"; s.dataset.persistPosition = "false"; document.body.appendChild(s); }</script>{% endif %}
  </body>
</html>
